[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-stock-trading"
version = "0.1.0"
description = "Auditable J-Quants V2 data foundation (stage 1 only)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pandas>=2.2,<3", "numpy>=2,<3", "duckdb>=1.4,<2", "pyarrow>=19,<24", "pydantic>=2.10,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
jstock = "trading_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real J-Quants API test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
